<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin Control Center{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; }
        .navbar { background-color: #0f172a; padding: 0 30px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .navbar .brand { color: #fff; font-size: 18px; font-weight: bold; text-decoration: none; }
        .navbar .nav-links { display: flex; gap: 10px; list-style: none; }
        .navbar .nav-links a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background-color: #2563eb; color: #ffffff; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/admin/dashboard" class="brand">⚙️ VTU Control Center</a>
        <ul class="nav-links">
            <li><a href="/admin/dashboard" class="{% if request.path == '/admin/dashboard' %}active{% endif %}">📊 Dashboard</a></li>
            <li><a href="/admin/users" class="{% if request.path == '/admin/users' %}active{% endif %}">👥 Track Users</a></li>
            <li><a href="/admin/transactions" class="{% if request.path == '/admin/transactions' %}active{% endif %}">💳 Transactions</a></li>
        </ul>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
