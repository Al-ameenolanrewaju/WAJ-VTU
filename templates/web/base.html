<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFC400">
<meta name="description" content="WAJ VTU helps you buy airtime, data, electricity, cable TV, betting, and exam pins quickly.">
<title>{% block title %}WAJ VTU{% endblock %}</title>
<link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/waj-vtu-logo.jpeg') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/waj-vtu-logo.jpeg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script defer src="{{ url_for('static', filename='install.js') }}"></script>
<style>
  :root {
    --indigo: #090909;
    --indigo-light: #1B1B1B;
    --amber: #FFC400;
    --amber-dark: #B88700;
    --bg: #F5F5F2;
    --card: #FFFFFF;
    --slate: #626262;
    --slate-light: #969696;
    --success: #2F9E44;
    --alert: #E46152;
    --border: #E4E4E0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; min-width:0; }
  img, video { max-width:100%; height:auto; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--indigo);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; }

  .app {
    width:100%;
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    padding-bottom: 40px;
  }

  .site-nav {
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:20px 28px;
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  .site-brand { color:var(--indigo); font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; text-decoration:none; }
  .site-brand span { color:var(--amber); }
  .site-nav-links { display:flex; align-items:center; gap:22px; font-size:13px; color:var(--slate); }
  .site-nav-links a { text-decoration:none; }
  .site-nav-links a:hover, .site-nav-links a.active { color:var(--indigo); }
  .site-nav-balance { color:var(--indigo); background:#f6f3eb; padding:9px 12px; border-radius:9px; font-weight:700; }
  .site-menu-toggle { display:none; border:1px solid var(--border); background:#fff; color:var(--indigo); border-radius:8px; padding:8px 10px; font-size:18px; cursor:pointer; }

  .page-shell { max-width:900px; margin:0 auto; padding:76px 28px 0; }
  .page-heading { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
  .page-heading h1 { font-family:'Space Grotesk',sans-serif; font-size:30px; letter-spacing:-.7px; margin-bottom:7px; }
  .page-heading p { color:var(--slate); font-size:14px; line-height:1.5; }
  .page-back { color:var(--amber-dark); font-size:13px; font-weight:700; text-decoration:none; padding-top:8px; white-space:nowrap; }
  .form-card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:26px; box-shadow:0 12px 30px rgba(0,0,0,.06); }
  .form-card label { display:block; color:var(--slate); font-size:12px; font-weight:700; margin-bottom:7px; }
  .form-card .form-note { color:var(--slate-light); font-size:12px; margin:-4px 0 18px; }

  html:has(body.landing), body.landing { background:#090909; }
  body.landing .app { max-width:1180px; background:transparent; padding-bottom:0; }
  body.landing .landing-page { --home-bg:#090909; --home-muted:#a7a7a4; --home-line:rgba(255,255,255,.13); color:#fff; min-height:100vh; overflow:hidden; background:var(--home-bg); }
  .landing-nav { display:flex; justify-content:space-between; align-items:center; padding:22px 58px; border-bottom:1px solid var(--home-line); }
  .brand-mark { color:#fff; font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; text-decoration:none; }
  .brand-mark span { color:var(--amber); }
  .landing-nav-actions { display:flex; align-items:center; gap:28px; font-size:13px; }
  .landing-nav-actions a { color:rgba(255,255,255,.78); text-decoration:none; }
  .landing-nav-actions a:hover, .home-secondary:hover { color:#fff; }
  .landing-nav-actions .nav-cta { display:inline-flex; align-items:center; gap:12px; background:var(--amber); color:var(--indigo); padding:12px 16px; border-radius:8px; font-weight:700; }
  .landing-nav-actions .nav-cta span, .home-primary span, .home-whatsapp a span, .home-footer a span { font-size:16px; line-height:1; }
  .home-hero { display:grid; grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr); gap:48px; align-items:center; padding:62px 58px 58px; }
  .home-hero-copy { max-width:490px; padding:18px 0; animation:home-enter .55s ease both; }
  .home-eyebrow, .home-section-kicker { color:var(--amber); font-size:10px; font-weight:700; letter-spacing:1.5px; }
  .home-eyebrow { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .home-eyebrow span, .home-art-dot { width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:var(--amber); }
  .home-eyebrow i, .home-hero-note i { width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.4); }
  .home-hero h1 { max-width:540px; font-family:'Space Grotesk',sans-serif; font-size:54px; line-height:1.04; font-weight:600; margin-bottom:20px; }
  .home-hero h1 em { color:var(--amber); font-style:normal; }
  .home-hero-copy > p { max-width:430px; color:var(--home-muted); font-size:16px; line-height:1.7; margin-bottom:27px; }
  .home-hero-actions { display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
  .home-primary { display:inline-flex; align-items:center; gap:18px; padding:14px 17px; border-radius:8px; background:var(--amber); color:#090909; font-size:13px; font-weight:700; text-decoration:none; transition:background .2s ease, transform .2s ease; }
  .home-primary:hover { background:#ffd84a; transform:translateY(-2px); }
  .home-secondary { color:rgba(255,255,255,.72); font-size:12px; font-weight:600; text-decoration:none; }
  .home-hero-note { display:flex; align-items:center; gap:10px; margin-top:29px; color:rgba(255,255,255,.66); font-size:10px; }
  .home-hero-note > span { color:var(--amber); font-size:15px; font-weight:700; }
  .home-hero-art { position:relative; margin:0; animation:home-enter .7s .08s ease both; }
  .home-hero-art img { display:block; width:100%; max-height:530px; object-fit:contain; border-radius:5px; filter:drop-shadow(0 22px 34px rgba(0,0,0,.38)); }
  .home-hero-art figcaption { position:absolute; right:16px; bottom:16px; display:flex; align-items:center; gap:9px; padding:10px 13px; border:1px solid rgba(255,255,255,.2); border-radius:6px; background:rgba(9,9,9,.88); color:rgba(255,255,255,.82); font-size:10px; }
  .home-art-dot { width:6px; height:6px; flex-basis:6px; }
  .home-proof { display:grid; grid-template-columns:repeat(3,1fr); margin:0 58px; padding:21px 0; border-top:1px solid var(--home-line); border-bottom:1px solid var(--home-line); }
  .home-proof > div { display:flex; align-items:center; gap:14px; padding:0 20px; border-right:1px solid var(--home-line); }
  .home-proof > div:first-child { padding-left:0; }
  .home-proof > div:last-child { border-right:0; }
  .home-proof-index { color:var(--amber); font-family:'Space Grotesk',sans-serif; font-size:12px; }
  .home-proof p { display:flex; flex-direction:column; gap:4px; }
  .home-proof strong { font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; }
  .home-proof small { color:var(--home-muted); font-size:10px; }
  .home-services { padding:70px 58px 74px; background:#f5f5f2; color:#090909; }
  .home-section-heading { display:flex; justify-content:space-between; align-items:end; gap:28px; margin-bottom:28px; }
  .home-section-kicker { color:#a77b00; margin-bottom:9px; }
  .home-section-heading h2, .home-whatsapp h2 { font-family:'Space Grotesk',sans-serif; font-size:31px; line-height:1.15; font-weight:600; }
  .home-section-heading > p { max-width:260px; color:#626262; font-size:12px; line-height:1.6; }
  .home-service-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); border-top:1px solid #deded9; border-left:1px solid #deded9; }
  .home-service { min-height:120px; display:grid; grid-template-columns:46px 1fr; grid-template-rows:auto auto; align-content:center; align-items:center; column-gap:14px; padding:20px; border-right:1px solid #deded9; border-bottom:1px solid #deded9; transition:background .2s ease; }
  .home-service:hover { background:#fff; }
  .home-service-icon { grid-row:span 2; width:42px; height:42px; display:grid; place-items:center; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; }
  .home-icon-airtime { background:#fff0d9; }
  .home-icon-data { background:#e4ecff; color:#315fd1; }
  .home-icon-power { background:#fff0d9; color:#9c6e00; font-size:27px; }
  .home-icon-tv { background:#e6f5e9; color:#267843; }
  .home-icon-exam { background:#f9e8e8; color:#a23e49; }
  .home-icon-wallet { background:#e7f5f3; color:#227e76; }
  .home-icon-saved { background:#fff2cc; color:#9c6e00; }
  .home-icon-history { background:#e8edf0; color:#445c68; }
  .home-icon-chat { background:#e5f4e9; color:#267843; }
  .home-service strong { font-size:13px; font-weight:700; }
  .home-service small { align-self:start; margin-top:4px; color:#777; font-size:10px; }
  .home-whatsapp { display:flex; align-items:center; gap:22px; margin:0 58px; padding:30px 0; border-bottom:1px solid var(--home-line); }
  .home-whatsapp-mark { width:43px; height:43px; display:grid; place-items:center; flex:0 0 43px; border:1px solid rgba(255,196,0,.5); border-radius:50%; color:var(--amber); font-size:21px; }
  .home-whatsapp-copy { flex:1; min-width:0; }
  .home-whatsapp .home-section-kicker { margin-bottom:7px; }
  .home-whatsapp h2 { font-size:20px; }
  .home-whatsapp p { color:var(--home-muted); font-size:11px; margin-top:5px; }
  .home-whatsapp > a { display:inline-flex; align-items:center; gap:20px; flex-shrink:0; padding:12px 15px; border:1px solid rgba(255,255,255,.24); border-radius:7px; color:#fff; font-size:11px; font-weight:700; text-decoration:none; }
  .home-whatsapp > a:hover { border-color:var(--amber); }
  .home-footer { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 58px 24px; }
  .home-footer .brand-mark { font-size:16px; }
  .home-footer > span { color:var(--home-muted); font-size:10px; }
  .home-footer > a:last-child { display:inline-flex; align-items:center; gap:8px; color:var(--amber); font-size:11px; font-weight:700; text-decoration:none; }
  @keyframes home-enter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .bot-ad { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:18px 20px; border-radius:16px; background:#111; border:1px solid rgba(255,196,0,.35); color:#fff; }
  .bot-ad-copy { min-width:0; }
  .bot-ad-label { color:var(--amber); font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:5px; }
  .bot-ad h2 { font-family:'Space Grotesk',sans-serif; font-size:20px; margin-bottom:5px; }
  .bot-ad p { color:rgba(255,255,255,.68); font-size:12px; line-height:1.45; }
  .bot-ad-cta { flex-shrink:0; background:var(--amber); color:#090909; padding:11px 14px; border-radius:9px; text-decoration:none; font-size:12px; font-weight:800; }
  .bot-ad-cta:hover { background:#fff; }
  .dashboard-bot-ad { max-width:1120px; margin:24px auto 0; padding:0 34px; }

  .dashboard-page header { background:var(--indigo); padding:28px 34px 74px; border-radius:0 0 30px 30px; }
  .dashboard-page .balance-card { max-width:760px; margin:24px auto -66px; padding:28px 30px 26px; border-radius:22px; }
  .dashboard-page .balance-amount { font-size:46px; }
  .dashboard-page .section { max-width:1120px; margin:0 auto; padding:96px 34px 0; }
  .dashboard-layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,.85fr); gap:24px; align-items:start; }
  .dashboard-panel { min-width:0; background:var(--card); border:1px solid var(--border); border-radius:20px; padding:22px; box-shadow:0 12px 30px rgba(0,0,0,.06); }
  .dashboard-panel .section-title { font-family:'Space Grotesk',sans-serif; font-size:19px; }
  .dashboard-panel .services-grid { margin-bottom:0; }
  .dashboard-panel .tx-list { max-height:440px; overflow:auto; }
  .dashboard-panel .tx-item { border-color:transparent; background:var(--bg); }
  .dashboard-panel .tx-item + .tx-item { margin-top:8px; }
  .dashboard-panel .tx-header { margin-bottom:18px; }
  .dashboard-panel .tx-header .section-kicker { margin-top:4px; line-height:1.4; }
  .dashboard-section-label { display:flex; justify-content:space-between; align-items:end; margin-bottom:16px; }
  .dashboard-section-label p { color:var(--slate); font-size:12px; margin-top:4px; }
  .dashboard-page .service-tile { min-height:116px; padding:18px 10px; }
  .dashboard-page .service-icon { width:46px; height:46px; font-size:20px; }
  .dashboard-page .service-tile strong { color:var(--indigo); font-size:13px; font-weight:700; }
  .dashboard-page .service-tile small { color:var(--slate-light); font-size:10px; text-align:center; line-height:1.25; }
  .wallet-hint { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--slate); font-size:12px; margin-bottom:10px; }
  .wallet-hint strong { color:var(--success); font-size:11px; }

  header {
    background: var(--indigo);
    padding: 24px 20px 64px;
    border-radius: 0 0 28px 28px;
    position: relative;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .dashboard-brand {
    color: rgba(255,255,255,.9);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: .2px;
  }

  .dashboard-brand span { color: var(--amber); }

  .header-tools { display:flex; align-items:center; gap:10px; }

  .notification-dot {
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;
    color:var(--amber);
    font-size:13px;
  }

  .admin-link {
    color: var(--indigo);
    background: var(--amber);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
  }

  .greeting {
    color: rgba(255,255,255,0.65);
    font-size: 13px;
    font-weight: 500;
  }

  .greeting strong {
    color: #fff;
    font-weight: 600;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--amber);
    color: var(--indigo);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .balance-card {
    background: var(--card);
    border-radius: 20px;
    padding: 22px 22px 20px;
    margin: 20px -20px -56px;
    box-shadow: 0 12px 32px rgba(28, 33, 72, 0.18);
    position: relative;
    z-index: 2;
  }

  .balance-label {
    font-size: 12.5px;
    color: var(--slate);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .balance-caption { color: var(--slate-light); font-size: 12px; margin-top: -12px; margin-bottom: 18px; }

  .balance-amount {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 700;
    margin: 6px 0 18px;
    letter-spacing: -0.5px;
  }

  .balance-amount span {
    font-size: 20px;
    color: var(--slate-light);
    font-weight: 600;
  }

  .balance-actions {
    display: flex;
    gap: 10px;
  }

  .balance-fund-form {
    display: flex;
    gap: 8px;
    flex: 1;
  }

  .balance-fund-form input {
    margin-bottom: 0;
    padding: 12px 10px;
    font-size: 13px;
  }

  .btn-primary, .btn-secondary {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s ease, opacity 0.15s ease;
    text-decoration: none;
    white-space: nowrap;
  }

  .btn-primary { background: var(--amber); color: var(--indigo); }
  .btn-secondary { background: var(--bg); color: var(--indigo); }
  .btn-primary:active, .btn-secondary:active { transform: scale(0.97); }

  .section { padding: 76px 20px 0; }
  .section.plain { padding: 20px 20px 0; }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    color: var(--indigo);
  }

  .section-heading { margin-bottom: 14px; }
  .section-kicker { color: var(--slate-light); font-size: 12px; margin-top: -9px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }

  form input, form select {
    width: 100%;
    padding: 13px 14px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--indigo);
  }

  form button[type="submit"] {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--amber);
    color: var(--indigo);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }

  form button[type="submit"]:active { transform: scale(0.98); }

  .plan-list {
    max-height: 300px;
    overflow-y: auto;
    background: var(--bg);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.9;
    border: 1px solid var(--border);
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }

  .service-tile {
    background: var(--card);
    border-radius: 16px;
    padding: 14px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    text-decoration: none;
  }

  .service-tile:active, .service-tile:hover { transform: translateY(-2px); border-color: var(--amber); box-shadow: 0 8px 18px rgba(28,33,72,.08); }

  .service-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .service-tile span {
    font-size: 11px;
    font-weight: 500;
    color: var(--slate);
    text-align: center;
    line-height: 1.2;
  }

  .icon-airtime { background: #FDF0DC; }
  .icon-data { background: #E3EAFD; }
  .icon-electric { background: #FDECEC; }
  .icon-tv { background: #E9F7ED; }
  .icon-exam { background: #F2E9FD; }
  .icon-betting { background: #E3F6F7; }
  .icon-recharge { background: #FEF3E3; }
  .icon-more { background: #EEEDF3; }

  .tx-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .tx-header a { font-size: 13px; color: var(--amber-dark); font-weight: 600; text-decoration: none; }

  .dashboard-section { padding-top: 58px; }

  .tx-list { display: flex; flex-direction: column; gap: 10px; }

  .tx-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
  }

  .tx-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .tx-details { flex: 1; min-width: 0; }
  .tx-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .tx-meta { font-size: 12px; color: var(--slate-light); }
  .tx-right { text-align: right; }
  .transaction-receipt { margin: -2px 0 10px; padding: 10px 14px 14px; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .transaction-receipt summary { color:var(--amber-dark); cursor:pointer; font-size:12px; font-weight:700; }
  .transaction-receipt img { display:block; width:min(100%,430px); height:auto; margin:12px auto 0; border:1px solid var(--border); border-radius:9px; }
  .tx-amount { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; }
  .tx-status { font-size: 11px; font-weight: 600; margin-top: 2px; }
  .status-success { color: var(--success); }
  .status-pending { color: var(--amber-dark); }
  .status-failed { color: var(--alert); }

  .flash-wrap { padding: 14px 20px 0; }
  .flash { padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; font-weight: 500; }
  .flash.success { background: #E9F7ED; color: var(--success); }
  .flash.error { background: #FDECEC; color: var(--alert); }
  .flash.message { background: #EEEDF3; color: var(--slate); }
  .dashboard-flashes { max-width:1120px; margin:0 auto; padding-left:34px; padding-right:34px; }

  .receipt-backdrop { position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(9,9,9,.62); }
  .receipt-modal { width:min(100%,430px); background:#fff; border-radius:20px; padding:26px; box-shadow:0 24px 70px rgba(0,0,0,.28); }
  .receipt-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
  .receipt-success { color:var(--success); font-size:12px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; }
  .receipt-modal h2 { font-family:'Space Grotesk',sans-serif; font-size:25px; margin-top:5px; }
  .receipt-close { width:32px; height:32px; border:1px solid var(--border); border-radius:50%; background:#fff; color:var(--slate); font-size:20px; cursor:pointer; }
  .receipt-amount { background:#f6f3eb; border-radius:14px; padding:18px; margin-bottom:16px; }
  .receipt-amount small { display:block; color:var(--slate); font-size:12px; margin-bottom:5px; }
  .receipt-amount strong { font-family:'Space Grotesk',sans-serif; font-size:30px; }
  .receipt-row { display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .receipt-row span { color:var(--slate); }
  .receipt-row strong { text-align:right; overflow-wrap:anywhere; }
  .receipt-extra { margin-top:16px; padding:13px; border-radius:11px; background:#e9f7ed; color:var(--success); font-size:13px; line-height:1.5; }
  .receipt-image { display:block; width:100%; height:auto; margin-top:18px; border:1px solid var(--border); border-radius:10px; }
  .receipt-actions { display:flex; gap:10px; margin-top:20px; }
  .receipt-actions button { flex:1; padding:12px; border:0; border-radius:11px; background:var(--amber); color:var(--indigo); font-weight:700; cursor:pointer; }
  .receipt-actions button.secondary { background:var(--bg); }

  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 20px; background:var(--indigo); position:relative; }
  .auth-brand-row { position:absolute; top:24px; left:28px; right:28px; display:flex; justify-content:space-between; align-items:center; }
  .auth-brand-row .site-brand { color:#fff; }
  .auth-brand-row .site-brand span { color:var(--amber); }
  .auth-home { color:rgba(255,255,255,.7); font-size:13px; font-weight:600; text-decoration:none; }
  .auth-home:hover { color:var(--amber); }
  .auth-card {
    background: var(--card);
    border-radius: 20px;
    padding: 32px 26px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 22px 70px rgba(0,0,0,.28);
    border:1px solid rgba(255,196,0,.2);
  }
  .auth-card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin-bottom: 22px; color: var(--indigo); }
  .auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--slate); }
  .auth-switch a { color: var(--amber-dark); font-weight: 600; text-decoration: none; }
  .reset-link-box { margin-top:16px; padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); font-size:12px; }
  .reset-link-box span { display:block; color:var(--slate-light); margin-bottom:5px; }
  .reset-link-box a { color:var(--amber-dark); font-weight:700; word-break:break-word; }
  .install-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border: 0;
    border-radius: 10px;
    background: var(--amber);
    color: var(--indigo);
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .install-button[hidden] { display: none; }

  @media (max-width: 900px) {
    .home-hero { grid-template-columns:1fr; gap:24px; padding:50px 34px 40px; }
    .home-hero-copy { max-width:650px; }
    .home-hero h1 { font-size:54px; }
    .home-hero-art { max-width:620px; margin-left:auto; }
  }

  @media (max-width: 720px) {
    .app { max-width:480px; }
    .dashboard-page header { padding:22px 18px 66px; }
    .dashboard-page .balance-card { margin-left:0; margin-right:0; padding:22px; }
    .dashboard-page .balance-amount { font-size:38px; }
    .dashboard-page .section { padding:88px 16px 0; }
    .dashboard-flashes { padding-left:16px; padding-right:16px; }
    .dashboard-layout { grid-template-columns:1fr; gap:16px; }
    .dashboard-panel { padding:18px; }
    .site-nav { padding:17px 18px; }
    .site-menu-toggle { display:block; }
    .site-nav-links { display:none; position:absolute; left:12px; right:12px; top:68px; z-index:10; flex-direction:column; align-items:stretch; gap:0; padding:8px; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 12px 28px rgba(0,0,0,.12); }
    .site-nav-links.open { display:flex; }
    .site-nav-links a { padding:12px; border-radius:8px; }
    .site-nav-links a:hover, .site-nav-links a.active { background:var(--bg); }
    .page-shell { padding:24px 16px 0; }
    .page-heading { flex-direction:column; gap:10px; margin-bottom:18px; }
    .page-heading h1 { font-size:26px; }
    .page-back { padding-top:0; }
    .form-card { padding:18px; }
    .site-brand { font-size:19px; }
    .bot-ad { align-items:flex-start; flex-direction:column; gap:13px; }
    .bot-ad-cta { width:100%; text-align:center; }
    .dashboard-bot-ad { padding:0 16px; }
    .home-bot-ad { margin:0 20px 44px; }
    .page-heading h1 { font-size:25px; }
    .form-card { padding:20px; }
    .landing-nav { padding:17px 20px; }
    .landing-nav-actions { gap:16px; font-size:12px; }
    .landing-nav-actions .nav-cta { gap:8px; padding:10px 12px; }
    .home-hero { grid-template-columns:1fr; gap:27px; padding:45px 20px 35px; }
    .home-hero-copy { padding:0; }
    .home-hero h1 { font-size:44px; }
    .home-hero-copy > p { font-size:14px; }
    .home-hero-note { flex-wrap:wrap; }
    .home-hero-art img { max-height:none; }
    .home-hero-art figcaption { right:9px; bottom:9px; padding:8px 10px; }
    .home-proof { margin:0 20px; padding:15px 0; }
    .home-proof > div { gap:8px; padding:0 8px; }
    .home-proof > div:first-child { padding-left:0; }
    .home-proof-index { font-size:10px; }
    .home-proof strong { font-size:11px; }
    .home-proof small { font-size:9px; }
    .home-services { padding:48px 20px; }
    .home-section-heading { display:block; margin-bottom:22px; }
    .home-section-heading h2 { font-size:27px; }
    .home-section-heading > p { margin-top:9px; }
    .home-service-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .home-service { min-height:104px; grid-template-columns:38px 1fr; column-gap:10px; padding:14px 10px; }
    .home-service-icon { width:36px; height:36px; font-size:17px; }
    .home-service strong { font-size:11px; }
    .home-service small { font-size:9px; }
    .home-service:nth-child(9) { grid-column:span 2; }
    .home-whatsapp { gap:13px; margin:0 20px; padding:24px 0; }
    .home-whatsapp-mark { width:36px; height:36px; flex-basis:36px; }
    .home-whatsapp h2 { font-size:17px; }
    .home-whatsapp p { font-size:10px; line-height:1.5; }
    .home-whatsapp > a { gap:9px; padding:10px; font-size:10px; }
    .home-footer { flex-wrap:wrap; padding:17px 20px 20px; }
    .home-footer > span { order:3; flex-basis:100%; }
    .services-grid { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:9px; }
    .service-tile { min-width:0; }
    .dashboard-page .service-tile { min-height:108px; padding:14px 7px; }
    .dashboard-page .service-tile small { max-width:100px; }
    .tx-item { min-width:0; padding:12px; gap:8px; }
    .tx-title { overflow-wrap:anywhere; }
    .tx-amount { font-size:13px; }
    .wallet-hint { align-items:flex-start; flex-direction:column; gap:4px; }
  }

  @media (max-width: 380px) {
    .app { width:100%; }
    header { padding-left:16px; padding-right:16px; }
    .section, .section.plain { padding-left:16px; padding-right:16px; }
    .balance-card { margin-left:-16px; margin-right:-16px; }
    .services-grid { gap:8px; }
    .admin-link { padding-left: 8px; padding-right: 8px; }
    .dashboard-page .balance-actions { flex-direction:column; }
    .dashboard-page header { padding-left:14px; padding-right:14px; }
    .dashboard-page .balance-card { padding:18px; }
    .dashboard-page .balance-amount { font-size:34px; }
    .dashboard-page .section { padding-left:12px; padding-right:12px; }
    .dashboard-bot-ad { padding-left:12px; padding-right:12px; }
    .home-hero { padding-left:14px; padding-right:14px; }
    .home-hero h1 { font-size:39px; }
    .home-proof { margin-left:14px; margin-right:14px; }
    .home-proof > div { padding-right:5px; padding-left:5px; }
    .home-services { padding-left:14px; padding-right:14px; }
    .home-whatsapp { flex-wrap:wrap; margin-left:14px; margin-right:14px; }
    .home-whatsapp-copy { flex-basis:calc(100% - 50px); }
    .home-whatsapp > a { margin-left:49px; }
    .home-footer { padding-left:14px; padding-right:14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .home-hero-copy, .home-hero-art { animation:none; }
    .home-primary, .home-service { transition:none; }
  }
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="app">
    {% block content %}{% endblock %}
  </div>
  <button class="install-button" type="button" data-install-app hidden>Install app</button>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var flashes = Array.from(document.querySelectorAll('.flash'));
      if (!flashes.length || !window.Swal) return;

      var alerts = flashes.map(function(flash) {
        var icon = flash.classList.contains('success') ? 'success' :
          (flash.classList.contains('error') ? 'error' : 'info');
        return { icon: icon, text: flash.textContent.trim() };
      });

      flashes.forEach(function(flash) { flash.remove(); });
      document.querySelectorAll('.flash-wrap').forEach(function(wrap) {
        if (!wrap.querySelector('.flash')) wrap.remove();
      });

      (async function() {
        for (var alert of alerts) {
          await Swal.fire({
            icon: alert.icon,
            title: alert.icon === 'success' ? 'Success' :
              (alert.icon === 'error' ? 'Something went wrong' : 'Notice'),
            text: alert.text,
            confirmButtonText: 'Continue',
            confirmButtonColor: '#FFC400',
            color: '#090909'
          });
        }
      })();
    });

    document.addEventListener('submit', function(e) {
      var form = e.target;
      var submitBtn = form.querySelector('button[type="submit"]');
      
      if (form.hasAttribute('onsubmit')) return;
      
      var isPurchase = form.action.includes('/buy/') || (submitBtn && submitBtn.textContent.toLowerCase().includes('buy'));
      
      if (submitBtn) {
        if (submitBtn.dataset.submitting === "true") {
          e.preventDefault();
          return;
        }
        submitBtn.dataset.submitting = "true";
        submitBtn.disabled = true;
        
        var originalText = submitBtn.textContent;
        submitBtn.textContent = "Processing...";
        
        if (isPurchase) {
          var backdrop = document.createElement('div');
          backdrop.className = 'receipt-backdrop';
          backdrop.id = 'processing-receipt';
          backdrop.innerHTML = `
            <div class="receipt-modal">
              <div class="receipt-top">
                <div>
                  <div class="receipt-success" style="color: var(--amber-dark);">Processing</div>
                  <h2 id="receipt-title">Please wait</h2>
                </div>
              </div>
              <div style="text-align: center; margin: 40px 0;">
                 <p style="color: var(--slate);">Your transaction is being processed. Do not refresh or close this page.</p>
              </div>
            </div>
          `;
          document.body.appendChild(backdrop);
        }
      }
    });
  </script>
</body>
</html>
