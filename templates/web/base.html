<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFC400">
<meta name="description" content="WAJ VTU helps you buy airtime, data, electricity, cable TV, and exam pins quickly with instant wallet funding.">
<title>{% block title %}WAJ VTU | Quick Airtime, Data, Bills & Wallet{% endblock %}</title>
<link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/waj-vtu-logo.jpeg') }}">
<link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='images/waj-vtu-logo.jpeg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script defer src="{{ url_for('static', filename='install.js') }}"></script>
<style>
  :root {
    --indigo: #090909;
    --indigo-light: #18181b;
    --amber: #FFDD00;
    --amber-hover: #facc15;
    --amber-dark: #eab308;
    --bg: #f8f9fa;
    --card: #ffffff;
    --slate: #52525b;
    --slate-light: #71717a;
    --slate-subtle: #a1a1aa;
    --border: #e4e4e7;
    --border-light: #f4f4f5;
    --success: #16a34a;
    --success-bg: #dcfce7;
    --alert: #dc2626;
    --alert-bg: #fee2e2;
    --pending: #d97706;
    --pending-bg: #fef3c7;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 100%; min-width: 0; scroll-behavior: smooth; }
  body {
    width: 100%;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--indigo);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    line-height: 1.5;
  }

  body.nav-drawer-open { overflow: hidden; }

  a { color: inherit; text-decoration: none; }
  img, video { max-width: 100%; height: auto; }
  button, input, select, textarea { font-family: inherit; }

  .app {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: 72px; /* space for mobile bottom nav */
  }

  @media (min-width: 769px) {
    .app { padding-bottom: 40px; }
  }

  /* ------------------------------------------------------------- */
  /* TOP NAVBAR                                                    */
  /* ------------------------------------------------------------- */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    width: 100%;
  }

  .site-nav-container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .site-nav-left {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .site-brand {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--indigo);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .site-brand-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--amber);
    color: var(--indigo);
    font-size: 16px;
  }

  .site-brand span { color: var(--amber-dark); }

  .site-nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--slate);
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-item:hover {
    color: var(--indigo);
    background: var(--border-light);
  }

  .nav-item.active {
    color: var(--indigo);
    background: #fff8e1;
    font-weight: 600;
    border-bottom: 2px solid var(--amber-dark);
  }

  .nav-icon { font-size: 15px; }

  /* Dropdown for Services */
  .nav-dropdown {
    position: relative;
  }

  .nav-dropdown-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    color: var(--slate);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-dropdown-toggle:hover, .nav-dropdown.open .nav-dropdown-toggle {
    color: var(--indigo);
    background: var(--border-light);
  }

  .nav-dropdown-toggle.active {
    color: var(--indigo);
    font-weight: 600;
  }

  .arrow-down { font-size: 11px; color: var(--slate-subtle); transition: transform 0.2s ease; }
  .nav-dropdown.open .arrow-down { transform: rotate(180deg); }

  .nav-dropdown-menu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 200px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: 6px;
    z-index: 120;
  }

  .nav-dropdown.open .nav-dropdown-menu,
  .nav-dropdown:hover .nav-dropdown-menu {
    display: flex;
    flex-direction: column;
    animation: menuFadeIn 0.15s ease-out;
  }

  @keyframes menuFadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .nav-dropdown-menu a {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--slate);
    transition: background 0.15s ease, color 0.15s ease;
  }

  .nav-dropdown-menu a:hover {
    background: #fff8e1;
    color: var(--indigo);
  }

  /* Right Tools */
  .site-nav-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .nav-admin-badge {
    background: #f1f5f9;
    color: #0f172a;
    border: 1px solid #cbd5e1;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    transition: all 0.15s ease;
  }

  .nav-admin-badge:hover {
    background: var(--indigo);
    color: #ffffff;
    border-color: var(--indigo);
  }

  .nav-wallet-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    transition: all 0.15s ease;
  }

  .nav-wallet-pill:hover {
    background: #fef3c7;
    border-color: var(--amber);
  }

  .pill-label { font-size: 11px; text-transform: uppercase; color: #92400e; font-weight: 600; }
  .pill-amount { font-family: 'Space Grotesk', sans-serif; font-size: 14px; color: var(--indigo); font-weight: 700; }
  .pill-add { font-size: 13px; color: #b45309; font-weight: 700; margin-left: 2px; }

  .nav-user-cluster {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--indigo);
    color: var(--amber);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--border);
  }

  .nav-logout-link {
    font-size: 13px;
    font-weight: 500;
    color: var(--slate);
    padding: 6px 10px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }

  .nav-logout-link:hover {
    background: #fee2e2;
    color: var(--alert);
  }

  .site-menu-toggle {
    display: none !important;
  }

  /* ------------------------------------------------------------- */
  /* MORE BOTTOM SHEET (MOBILE)                                    */
  /* ------------------------------------------------------------- */
  .mobile-more-sheet-wrapper {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: flex-end;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .mobile-more-sheet-wrapper.open {
    display: flex;
  }

  .more-sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .more-sheet-panel {
    position: relative;
    width: 100%;
    max-width: 540px;
    max-height: 86vh;
    background: #0f0f0f;
    border: 1.5px solid #262626;
    border-bottom: none;
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: sheetSlideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 2;
    padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
  }

  @keyframes sheetSlideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .more-sheet-handle-wrap {
    width: 100%;
    padding: 10px 0 4px;
    display: flex;
    justify-content: center;
    cursor: pointer;
  }

  .more-sheet-handle {
    width: 42px;
    height: 5px;
    border-radius: 999px;
    background: #333333;
    transition: background 0.15s ease;
  }

  .more-sheet-handle-wrap:hover .more-sheet-handle {
    background: #FFDD00;
  }

  .more-sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px 12px;
    border-bottom: 1px solid #1f1f1f;
  }

  .more-user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .more-user-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #FFDD00;
    color: #090909;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(255, 221, 0, 0.3);
  }

  .more-user-text {
    min-width: 0;
  }

  .more-user-name {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .more-user-phone {
    display: block;
    font-size: 12px;
    color: #94a3b8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .more-sheet-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #1f1f1f;
    border: 1px solid #333333;
    color: #ffffff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
    line-height: 1;
  }

  .more-sheet-close:hover {
    background: #2d2d2d;
    color: #FFDD00;
  }

  /* Wallet Balance Strip Inside More Sheet */
  .more-wallet-card {
    background: #171717;
    border: 1px solid #262626;
    border-radius: 14px;
    margin: 12px 20px 8px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .more-wallet-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #94a3b8;
    margin-bottom: 2px;
  }

  .more-wallet-balance {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 800;
    color: #FFDD00;
  }

  .more-fund-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #FFDD00;
    color: #090909;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    font-weight: 800;
    padding: 7px 14px;
    border-radius: 8px;
    text-decoration: none;
    transition: transform 0.15s ease;
  }

  .more-fund-btn:hover {
    transform: translateY(-1px);
  }

  /* Scrollable Sections List */
  .more-sheet-scrollable {
    overflow-y: auto;
    padding: 8px 20px 20px;
    flex: 1;
    overscroll-behavior: contain;
  }

  .more-nav-section {
    margin-bottom: 16px;
  }

  .more-section-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #71717a;
    margin: 0 4px 6px;
  }

  .more-nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    background: #161616;
    border: 1px solid #242424;
    border-radius: 12px;
    margin-bottom: 6px;
    color: #ffffff;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    cursor: pointer;
  }

  .more-nav-item:hover, .more-nav-item:active {
    background: #202020;
    border-color: #3b3b3b;
    transform: translateX(2px);
  }

  .more-item-icon {
    font-size: 17px;
    line-height: 1;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  .more-item-flex {
    flex: 1;
    min-width: 0;
  }

  .more-item-label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: #f1f5f9;
  }

  .more-item-sub {
    display: block;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 1px;
  }

  .more-item-chevron {
    color: #52525b;
    font-size: 16px;
    font-weight: 700;
    margin-left: auto;
  }

  .more-item-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    background: #27272a;
    color: #a1a1aa;
    margin-left: auto;
  }

  .more-item-badge.best {
    background: rgba(255, 221, 0, 0.15);
    color: #FFDD00;
    border: 1px solid rgba(255, 221, 0, 0.3);
  }

  .more-admin-section .more-nav-item {
    border-color: rgba(255, 221, 0, 0.3);
    background: #1a1700;
  }

  .more-admin-section .more-item-label {
    color: #FFDD00;
    font-weight: 700;
  }

  .more-logout-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    background: rgba(220, 38, 38, 0.12);
    border: 1px solid rgba(220, 38, 38, 0.25);
    color: #f87171;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 12px;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .more-logout-btn:hover {
    background: rgba(220, 38, 38, 0.2);
  }

  /* Profile & Settings Lightbox Modals */
  .user-modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .user-modal-box {
    width: 100%;
    max-width: 440px;
    background: #0f0f0f;
    border: 1.5px solid #262626;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    overflow: hidden;
    animation: modalScale 0.2s ease-out;
  }

  @keyframes modalScale {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .user-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #222222;
    background: #141414;
  }

  .user-modal-close {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }

  .user-modal-body {
    padding: 20px;
  }

  .profile-avatar-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  .profile-avatar-large {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #FFDD00;
    color: #090909;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .profile-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .profile-info-item {
    background: #171717;
    border: 1px solid #262626;
    border-radius: 10px;
    padding: 10px 12px;
  }

  .profile-info-item small {
    display: block;
    font-size: 11px;
    color: #71717a;
    margin-bottom: 2px;
  }

  .profile-info-item strong {
    display: block;
    font-size: 13px;
    color: #ffffff;
    word-break: break-all;
  }

  .settings-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .settings-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #171717;
    border: 1px solid #262626;
    border-radius: 12px;
    color: #ffffff;
  }

  .settings-item strong {
    display: block;
    font-size: 13.5px;
  }

  .settings-item small {
    display: block;
    font-size: 11px;
    color: #94a3b8;
  }

  .settings-status-badge {
    background: rgba(16, 185, 129, 0.15);
    color: #10b981;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .settings-link-action {
    background: #27272a;
    color: #FFDD00;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 8px;
    text-decoration: none;
  }

  .user-modal-footer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid #222222;
    background: #141414;
  }

  .user-modal-btn-primary {
    flex: 1;
    background: #FFDD00;
    color: #090909;
    font-weight: 800;
    font-size: 13.5px;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
  }

  .user-modal-btn-secondary {
    flex: 1;
    background: #262626;
    border: 1px solid #333333;
    color: #ffffff;
    font-weight: 700;
    font-size: 13.5px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
  }

  /* ------------------------------------------------------------- */
  /* MOBILE BOTTOM NAVIGATION                                      */
  /* ------------------------------------------------------------- */
  .mobile-bottom-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: #090909;
    border-top: 1px solid #262626;
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.45);
    z-index: 990;
    justify-content: space-around;
    align-items: center;
    padding: 0 4px calc(env(safe-area-inset-bottom, 0px));
  }

  .bnav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: #94a3b8;
    font-size: 10.5px;
    font-weight: 600;
    flex: 1;
    height: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s ease;
    padding: 4px 0;
    -webkit-tap-highlight-color: transparent;
  }

  .bnav-item:hover, .bnav-item.active {
    color: #FFDD00;
  }

  .bnav-item.active .bnav-icon {
    transform: scale(1.15);
    filter: drop-shadow(0 2px 6px rgba(255, 221, 0, 0.45));
  }

  .bnav-icon { font-size: 19px; line-height: 1; transition: transform 0.15s ease; }
  .bnav-text { line-height: 1; font-family: 'Space Grotesk', sans-serif; letter-spacing: 0.2px; }

  /* Visually Emphasized Center Fund Button */
  .bnav-item.bnav-fund {
    position: relative;
    top: -14px;
    flex: 0 0 64px;
  }

  .bnav-fund-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #FFDD00;
    color: #090909;
    font-size: 24px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(255, 221, 0, 0.45);
    border: 3px solid #090909;
    transition: transform 0.15s ease;
  }

  .bnav-item.bnav-fund:active .bnav-fund-circle {
    transform: scale(0.94);
  }

  .bnav-item.bnav-fund .bnav-text {
    margin-top: 2px;
    color: #FFDD00;
    font-weight: 700;
  }

  /* ------------------------------------------------------------- */
  /* SUBPAGE WALLET BANNER                                         */
  /* ------------------------------------------------------------- */
  .subpage-wallet-banner {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
  }

  .swb-container {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow-sm);
  }

  .swb-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .swb-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #fff8e1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .swb-label { font-size: 11px; text-transform: uppercase; color: var(--slate-light); font-weight: 600; display: block; }
  .swb-amount { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--indigo); }
  .swb-amount span { color: var(--slate-light); font-size: 16px; margin-right: 2px; }

  .swb-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .swb-fund-btn {
    background: var(--amber);
    color: var(--indigo);
    font-weight: 700;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    transition: background 0.15s ease;
  }

  .swb-fund-btn:hover { background: var(--amber-hover); }

  .swb-link {
    background: var(--border-light);
    color: var(--indigo);
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
  }

  /* ------------------------------------------------------------- */
  /* CUSTOMER DASHBOARD LAYOUT & SECTIONS                          */
  /* ------------------------------------------------------------- */
  .customer-dashboard-container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 24px 40px;
    width: 100%;
  }

  .dash-section {
    margin-bottom: 28px;
  }

  /* Section 1: Welcome */
  .welcome-box {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 4px 0 8px;
  }

  .welcome-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--indigo);
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .welcome-subtitle {
    color: var(--slate);
    font-size: 14px;
  }

  .whatsapp-status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .whatsapp-status-pill.connected {
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #bbf7d0;
  }

  .whatsapp-status-pill.link-cta {
    background: #111827;
    color: #ffffff;
    border: 1px solid #1f2937;
    transition: background 0.15s ease;
  }

  .whatsapp-status-pill.link-cta:hover {
    background: #25d366;
    color: #ffffff;
    border-color: #25d366;
  }

  .ws-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
  }

  /* Section 2: Wallet Card */
  .prominent-wallet-card {
    background: linear-gradient(135deg, #090909 0%, #1c1917 100%);
    border-radius: var(--radius-xl);
    color: #ffffff;
    box-shadow: 0 12px 28px -4px rgba(0,0,0,0.18), 0 4px 10px -2px rgba(0,0,0,0.08);
    border: 1px solid rgba(255, 196, 0, 0.15);
    overflow: hidden;
  }

  .wallet-card-main {
    padding: 32px 32px 28px;
  }

  .wallet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .wallet-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--amber);
  }

  .wallet-instant-badge {
    font-size: 11px;
    font-weight: 600;
    color: #4ade80;
    background: rgba(74, 222, 128, 0.12);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .wallet-figure {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 22px;
    display: flex;
    align-items: baseline;
    gap: 4px;
    color: #ffffff;
  }

  .currency-symbol {
    font-size: 26px;
    color: var(--amber);
    font-weight: 600;
  }

  .wallet-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .btn-wallet-primary {
    background: var(--amber);
    color: var(--indigo);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .btn-wallet-primary:hover {
    background: #ffd84a;
    transform: translateY(-1px);
  }

  .btn-wallet-secondary {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: var(--radius-md);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    transition: background 0.15s ease;
  }

  .btn-wallet-secondary:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .wallet-card-footer {
    background: rgba(0, 0, 0, 0.35);
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 14px 32px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .wallet-info-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .wii-label { font-size: 10px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.05em; }
  .wii-val { font-size: 13px; color: #ffffff; font-weight: 600; }

  /* Section Title Bar */
  .section-title-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 16px;
    gap: 12px;
  }

  .section-heading-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--indigo);
  }

  .section-subheading-text {
    font-size: 13px;
    color: var(--slate);
    margin-top: 2px;
  }

  .see-all-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--amber-dark);
    white-space: nowrap;
    transition: color 0.15s ease;
  }

  .see-all-link:hover { color: #855e00; text-decoration: underline; }

  /* Section 3: Quick Services Grid */
  .services-action-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .service-action-tile {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }

  .service-action-tile:hover {
    transform: translateY(-2px);
    border-color: #ffd84a;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
  }

  .service-tile-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .icon-airtime { background: #fff8e1; }
  .icon-data { background: #e0f2fe; }
  .icon-tv { background: #f3e8ff; }
  .icon-electric { background: #fef3c7; }
  .icon-betting { background: #dcfce7; }
  .icon-exam { background: #fae8ff; }
  .icon-more { background: #f1f5f9; }

  .service-tile-content {
    flex: 1;
    min-width: 0;
  }

  .service-tile-content strong {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--indigo);
    margin-bottom: 2px;
  }

  .service-tile-content small {
    display: block;
    font-size: 12px;
    color: var(--slate-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .service-tile-arrow {
    color: var(--slate-subtle);
    font-size: 16px;
    transition: transform 0.15s ease, color 0.15s ease;
  }

  .service-action-tile:hover .service-tile-arrow {
    transform: translateX(3px);
    color: var(--amber-dark);
  }

  /* Section 4: Compact Referral Card */
  .compact-referral-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    box-shadow: var(--shadow-sm);
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 28px;
    align-items: center;
  }

  .ref-badge {
    display: inline-block;
    background: #fff8e1;
    color: #92400e;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }

  .ref-heading {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--indigo);
    margin-bottom: 6px;
  }

  .ref-subtext {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .ref-metrics-inline {
    display: flex;
    gap: 20px;
  }

  .ref-metric-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rmi-label { font-size: 11px; color: var(--slate-light); text-transform: uppercase; }
  .rmi-val { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: var(--indigo); }
  .rmi-val.success { color: var(--success); }

  .ref-link-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--slate);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .ref-copy-box {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .ref-copy-box input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 12px;
    font-family: monospace;
    color: var(--indigo);
  }

  .btn-copy-link {
    background: var(--amber);
    color: var(--indigo);
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .btn-copy-link:hover { background: var(--amber-hover); }

  .ref-share-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn-share-whatsapp {
    background: #25d366;
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s ease;
  }

  .btn-share-whatsapp:hover { opacity: 0.92; }

  .btn-view-stats {
    font-size: 13px;
    font-weight: 600;
    color: var(--slate);
    transition: color 0.15s ease;
  }

  .btn-view-stats:hover { color: var(--indigo); text-decoration: underline; }

  /* Section 5: Recent Transactions Table */
  .transactions-container {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .modern-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }

  .modern-table th {
    background: #f8fafc;
    color: var(--slate);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  .modern-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-light);
    color: var(--indigo);
    vertical-align: middle;
  }

  .modern-table tr:last-child td {
    border-bottom: none;
  }

  .modern-table tr:hover td {
    background: #fafafa;
  }

  .tx-cell-service {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .tx-type-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .tx-mobile-date {
    display: none;
    font-size: 11px;
    color: var(--slate-light);
  }

  .tx-cell-ref code {
    font-family: monospace;
    font-size: 12px;
    color: var(--slate);
  }

  .tx-recipient-text {
    display: block;
    font-size: 11px;
    color: var(--slate-light);
  }

  .tx-cell-amount {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }

  .tx-cell-amount.positive { color: var(--success); }
  .tx-cell-amount.negative { color: var(--indigo); }

  .status-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .status-badge.status-success {
    background: var(--success-bg);
    color: var(--success);
  }

  .status-badge.status-pending {
    background: var(--pending-bg);
    color: var(--pending);
  }

  .status-badge.status-failed {
    background: var(--alert-bg);
    color: var(--alert);
  }

  .tx-cell-date {
    font-size: 12px;
    color: var(--slate-light);
    white-space: nowrap;
  }

  .btn-receipt-view {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--indigo);
    background: var(--border-light);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }

  .btn-receipt-view:hover {
    background: var(--amber);
    border-color: var(--amber);
  }

  .tx-no-receipt { color: var(--slate-subtle); }

  /* Empty State Card */
  .empty-state-card {
    padding: 48px 24px;
    text-align: center;
  }

  .empty-icon { font-size: 36px; display: block; margin-bottom: 12px; }
  .empty-state-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .empty-state-card p { font-size: 13px; color: var(--slate-light); margin-bottom: 16px; }
  .btn-empty-action {
    display: inline-block;
    background: var(--amber);
    color: var(--indigo);
    font-weight: 700;
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 8px;
  }

  /* Section 6: Saved Services Grid */
  .saved-services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .saved-service-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }

  .saved-card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #fff8e1;
    color: #b45309;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .saved-card-body {
    flex: 1;
    min-width: 0;
  }

  .saved-card-title {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--indigo);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .saved-card-sub {
    display: block;
    font-size: 11px;
    color: var(--slate-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .saved-card-remove {
    background: transparent;
    border: none;
    color: var(--slate-subtle);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    transition: color 0.15s ease;
  }

  .saved-card-remove:hover { color: var(--alert); }

  /* ------------------------------------------------------------- */
  /* FORM PAGES & GENERAL UI (Page Shell, Forms, Alerts)           */
  /* ------------------------------------------------------------- */
  .page-shell {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    width: 100%;
  }

  .page-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 24px;
  }

  .page-heading h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin-bottom: 4px;
  }

  .page-heading p {
    color: var(--slate);
    font-size: 14px;
  }

  .page-back {
    color: var(--amber-dark);
    font-size: 13px;
    font-weight: 700;
    padding-top: 4px;
    white-space: nowrap;
  }

  .page-back:hover { text-decoration: underline; }

  .form-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-sm);
  }

  .form-card label {
    display: block;
    color: var(--slate);
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  form input, form select, form textarea {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    background: #ffffff;
    color: var(--indigo);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  form input:focus, form select:focus, form textarea:focus {
    outline: none;
    border-color: var(--amber);
    box-shadow: 0 0 0 3px rgba(255, 196, 0, 0.25);
  }

  form button[type="submit"], .btn-primary {
    width: 100%;
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--amber);
    color: var(--indigo);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  form button[type="submit"]:hover, .btn-primary:hover {
    background: var(--amber-hover);
  }

  form button[type="submit"]:active, .btn-primary:active {
    transform: scale(0.99);
  }

  /* Flash alerts */
  .flash-wrap {
    margin-bottom: 20px;
    width: 100%;
  }

  .flash {
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .flash.success { background: var(--success-bg); color: #15803d; border: 1px solid #bbf7d0; }
  .flash.error { background: var(--alert-bg); color: #b91c1c; border: 1px solid #fecaca; }
  .flash.message { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }

  /* Receipt Modal */
  .receipt-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(9, 9, 9, 0.65);
    backdrop-filter: blur(2px);
  }

  .receipt-modal {
    width: min(100%, 420px);
    background: #ffffff;
    border-radius: var(--radius-xl);
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    max-height: 90vh;
    overflow-y: auto;
  }

  .receipt-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
  }

  .receipt-success {
    color: var(--success);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .receipt-modal h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    margin-top: 4px;
  }

  .receipt-close {
    width: 32px;

  }

  @media (prefers-reduced-motion: reduce) {

</style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="app">
    {% block content %}{% endblock %}
  </div>
  <button class="install-button" type="button" data-install-app hidden>Install app</button>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var flashes = Array.from(document.querySelectorAll('.flash'));
      if (!flashes.length || !window.Swal) return;

      var alerts = flashes.map(function(flash) {
        var icon = flash.classList.contains('success') ? 'success' :
          (flash.classList.contains('error') ? 'error' : 'info');
        return { icon: icon, text: flash.textContent.trim() };
      });

      flashes.forEach(function(flash) { flash.remove(); });
      document.querySelectorAll('.flash-wrap').forEach(function(wrap) {
        if (!wrap.querySelector('.flash')) wrap.remove();
      });

      (async function() {
        for (var alert of alerts) {
          await Swal.fire({
            icon: alert.icon,
            title: alert.icon === 'success' ? 'Success' :
              (alert.icon === 'error' ? 'Something went wrong' : 'Notice'),
            text: alert.text,
            confirmButtonText: 'Continue',
            confirmButtonColor: '#FFC400',
            color: '#090909'
          });
        }
      })();
    });

    document.addEventListener('submit', function(e) {
      var form = e.target;
      var submitBtn = form.querySelector('button[type="submit"]');
      if (form.hasAttribute('onsubmit')) return;
      
      var isPurchase = form.action.includes('/buy/') || (submitBtn && submitBtn.textContent.toLowerCase().includes('buy'));
      
      if (submitBtn) {
        if (submitBtn.dataset.submitting === "true") {
          e.preventDefault();
          return;
        }
        submitBtn.dataset.submitting = "true";
        submitBtn.disabled = true;
        submitBtn.textContent = "Processing...";
        
        if (isPurchase) {
          var backdrop = document.createElement('div');
          backdrop.className = 'receipt-backdrop';
          backdrop.id = 'processing-receipt';
          backdrop.innerHTML = `
            <div class="receipt-modal">
              <div class="receipt-top">
                <div>
                  <div class="receipt-success" style="color: var(--amber-dark);">Processing</div>
                  <h2 id="receipt-title">Please wait</h2>
                </div>
              </div>
              <div style="text-align: center; margin: 30px 0;">
                 <p style="color: var(--slate); font-size: 14px;">Your transaction is being submitted to the network. Please do not refresh or close this page.</p>
              </div>
            </div>
          `;
          document.body.appendChild(backdrop);
        }
      }
    });
  </script>
</body>
</html>
