{% extends "web/base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-brand-row"><a class="site-brand" href="{{ url_for('web.home') }}">WAJ <span>VTU</span></a><a class="auth-home" href="{{ url_for('web.home') }}">Home</a></div>
  <div class="auth-card">
    <h1>Welcome back</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Password (customers only)">
      <button type="submit">Log in to your wallet</button>
    </form>
    <div class="auth-switch"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></div>
    <div class="auth-switch">No account? <a href="{{ url_for('auth.signup') }}">Sign up</a></div>
  </div>
</div>
{% endblock %}
