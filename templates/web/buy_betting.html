{% extends "web/base.html" %}
{% block content %}
{% include "web/_service_nav.html" %}
{% include "web/_header.html" %}
<main class="page-shell">
  <div class="page-heading"><div><h1>Betting top-up</h1><p>Add funds to your betting wallet in a few seconds.</p></div><a class="page-back" href="{{ url_for('web.dashboard') }}">Back to dashboard</a></div>
  <div class="form-card">
    <form method="POST" action="{{ url_for('web.betting_page') }}">
      <label>Betting platform</label>
      <select name="platform">
        {% for p in ["BET9JA", "SPORTYBET", "NAIRABET", "1XBET", "BETKING"] %}
        <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
      </select>
      <label>Customer ID</label>
      {% if saved_services %}<select onchange="document.querySelector('[name=account_id]').value=this.value"><option value="">Use a saved account</option>{% for saved in saved_services %}<option value="{{ saved.identifier }}">{{ saved.label }}</option>{% endfor %}</select>{% endif %}
      <input name="account_id" placeholder="Enter your betting ID" required>
      <label>Top-up amount</label>
      <input name="amount" type="number" min="100" step="0.01" placeholder="Amount in NGN" required>
      <label><input type="checkbox" name="save_service"> Save this account for next time</label>
      <input name="save_label" placeholder="Label (optional)">
      <button type="submit">Fund Account</button>
    </form>
  </div>
</main>
{% endblock %}
