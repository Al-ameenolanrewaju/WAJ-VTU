{% extends "web/base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-brand-row"><a class="site-brand" href="{{ url_for('web.home') }}">WAJ <span>VTU</span></a><a class="auth-home" href="{{ url_for('web.home') }}">Home</a></div>
  <div class="auth-card">
    <h1>Choose a new password</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <form method="POST">
      <input name="password" type="password" placeholder="New password" minlength="8" required>
      <input name="password_confirmation" type="password" placeholder="Confirm new password" minlength="8" required>
      <button type="submit">Save new password</button>
    </form>
  </div>
</div>
{% endblock %}
