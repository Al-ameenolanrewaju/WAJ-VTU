services:
  - type: web
    name: waj-vtu
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FLASK_ENV
        value: production
      - key: ALLOW_DB_MUTATIONS
        value: "false"
      - key: DATABASE_URL
        sync: false # Required: set to a persistent Render Postgres or Supabase URL
      - key: SECRET_KEY
        sync: false # Required: set a persistent secret in the Render dashboard
      - key: APP_BASE_URL
        value: https://waj-vtu.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://waj-vtu.onrender.com
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://waj-vtu.onrender.com/payments/paystack/callback
      - key: META_API_TOKEN
        sync: false # Required for official WhatsApp Cloud API sending
      - key: META_PHONE_NUMBER_ID
        sync: false # Required for official WhatsApp Cloud API sending
      - key: META_VERIFY_TOKEN
        sync: false # Required for webhook verification
      - key: META_API_VERSION
        value: v20.0
      - key: CLUBKONNECT_USERID
        sync: false
      - key: CLUBKONNECT_APIKEY
        sync: false
      - key: CLUBKONNECT_BASE_URL
        value: https://www.nellobytesystems.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BRIDGE_URL
        value: https://waj-vtu-1.onrender.com/api/sendText
      - key: BRIDGE_API_TOKEN
        sync: false
  - type: web
    name: waj-vtu-bridge
    env: node
    rootDir: bridge
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FLASK_WEBHOOK_URL
        value: https://waj-vtu.onrender.com/webhook
      - key: BRIDGE_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    disk:
      name: whatsapp-auth
      mountPath: /opt/render/project/src/bridge/auth_info
      sizeGB: 1